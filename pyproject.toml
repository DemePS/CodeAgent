[project]
name = "coding-agent"
version = "0.1.0"
description = "Personal coding agent: Claude on Azure (Microsoft Foundry) with a manual tool-use loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.71.0,<1", # Claude API (AnthropicFoundry client)
    "azure-identity>=1.25.3", # Azure AD sign-in when no API key is set
    "httpx>=0.28.1", # download_file
    "python-dotenv>=1.1.1", # reads .env
    "mcp[cli]>=1.18.0", # the weather MCP example (weather.py, client.py)
    "openpyxl>=3.1.5", # read_excel / edit_excel
    "pypdf>=6.19.0", # read_pdf (page ranges, text mode)
]

[project.optional-dependencies]
# screenshot_page: `uv sync --extra browser`, then `uv run playwright install chromium`
browser = ["playwright>=1.49"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The coding_agent package, with its bundled skills (coding_agent/skills/*/SKILL.md).
packages = ["coding_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
