[project]
name = "coding-agent"
version = "0.1.0"
description = "Personal coding agent: Claude on Azure (Microsoft Foundry) with a manual tool-use loop"
readme = "README.md"
requires-python = ">=3.10"
# Exact versions: the ones tested together (uv.lock pins their own dependencies too). To upgrade,
# change a version here, run `uv lock`, and run the tests.
dependencies = [
    "anthropic==0.125.0", # Claude API (AnthropicFoundry client)
    "azure-identity==1.25.3", # Azure AD sign-in when no API key is set
    # Signs in with the account of the Windows session (no prompt on company PCs)
    "azure-identity-broker==1.3.0; sys_platform == 'win32'",
    "httpx==0.28.1", # download_file
    "python-dotenv==1.1.1", # reads .env
    "openpyxl==3.1.5", # read_excel / edit_excel
    "pypdf==6.19.0", # read_pdf (page ranges, text mode)
]

[project.optional-dependencies]
# screenshot_page: `uv sync --extra browser`, then `uv run playwright install chromium`
browser = ["playwright==1.63.0"]
# The weather MCP example in this repository (weather.py, client.py): `uv sync --extra weather`
weather = ["mcp[cli]==1.18.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The coding_agent package, with its bundled skills (coding_agent/skills/*/SKILL.md).
packages = ["coding_agent"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
